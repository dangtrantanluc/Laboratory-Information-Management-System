# Overlay chạy test — dùng kèm docker-compose.yml, không thay thế nó.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm lims-test
#
# Hoặc dùng script gọn hơn: ./scripts/test-backend.sh
#
# `profiles: [test]` giữ service này KHÔNG khởi động khi chạy `docker compose up`
# thường — nó chỉ tồn tại khi được gọi tên.
#
# Xem MAINTAINABILITY_PLAN.md §T2.1.

services:
  lims-test:
    profiles: ["test"]
    build:
      context: ./lims-backend
      dockerfile: Dockerfile.test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # DB riêng cho test — KHÔNG trỏ vào DB dev/prod. Test integration sẽ
      # chạy alembic upgrade head lên chính DB này rồi rollback từng test.
      DATABASE_URL: postgresql+psycopg2://lims:lims@postgres:5432/lims_test
      TEST_DATABASE_URL: postgresql+psycopg2://lims:lims@postgres:5432/lims_test
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: test-only-secret-not-used-anywhere-else
      ENVIRONMENT: development
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: testtest
      MINIO_BUCKET: lims-test
    volumes:
      # Mount mã nguồn để sửa test là chạy lại được ngay, không phải rebuild.
      - ./lims-backend/app:/app/app:ro
