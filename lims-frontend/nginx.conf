server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy API về backend container — browser chỉ gọi cùng origin (không CORS, không phụ thuộc localhost:8060)
    location /api/ {
        proxy_pass http://lims-api:8060/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # ── IP thật của người dùng (R3.1 / ARCHITECTURE_AUDIT F-04) ──
        # Cloudflare đặt IP người dùng ở CF-Connecting-IP; gọi trực tiếp trong LAN thì
        # dùng $remote_addr.
        #
        # CỐ Ý KHÔNG dùng $proxy_add_x_forwarded_for: biến đó CỘNG DỒN header client
        # gửi lên, nên kẻ tấn công tự đặt "X-Forwarded-For: 1.2.3.4" sẽ chèn được giá
        # trị giả vào đầu chuỗi và né rate limit. Ở đây ta GHI ĐÈ bằng giá trị nginx
        # tự xác định, không tin bất cứ thứ gì client gửi.
        set $real_client $remote_addr;
        if ($http_cf_connecting_ip) { set $real_client $http_cf_connecting_ip; }
        proxy_set_header X-Real-IP       $real_client;
        proxy_set_header X-Forwarded-For $real_client;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 25m;
    }

    # Proxy tải file MinIO (presigned URL path-style /lims-attachments/...) — same-origin qua cổng 3060.
    # Giữ nguyên Host để chữ ký presigned (s3v4) khớp (MINIO_PUBLIC_ENDPOINT = origin này).
    location /lims-attachments/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        # Giữ nguyên Host KÈM PORT để chữ ký presigned s3v4 (ký theo host:port) khớp
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 25m;

        # ── Tệp do NGƯỜI DÙNG tải lên — coi là nội dung không tin được ──
        # Backend chỉ kiểm MIME theo lời khai của client, KHÔNG kiểm magic bytes
        # (docs/SECURITY_AUDIT.md S-06). Một tệp HTML khai là application/pdf vẫn
        # vào được kho. nosniff chặn trình duyệt tự suy diễn kiểu; CSP 'none' +
        # sandbox chặn nó chạy script nếu vì lý do gì đó được render.
        #
        # proxy_hide_header trước add_header: MinIO cũng tự đặt nosniff, không giấu đi
        # thì response mang HAI dòng cùng tên — vô hại nhưng mập mờ khi đọc log/kiểm tra.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Content-Type-Options  "nosniff"                        always;
        add_header Content-Security-Policy "default-src 'none'; sandbox"    always;
        add_header X-Frame-Options         "DENY"                           always;
    }

    # SPA fallback — mọi route trả về index.html (react-router xử lý client-side)
    location / {
        try_files $uri $uri/ /index.html;

        # ── Security header cho TÀI LIỆU HTML ──
        # Middleware bảo mật của backend (app/middleware/security_headers.py) CHỈ áp
        # cho response của /api/. Tài liệu HTML, JS, CSS do nginx phục vụ nên trước đây
        # KHÔNG có header nào — không CSP, không chống clickjacking.
        #
        # LƯU Ý nginx: add_header KHÔNG kế thừa xuống location đã có add_header riêng.
        # Vì vậy khối này được LẶP LẠI ở /assets/ bên dưới. Kiểm bằng:
        #   curl -sI https://<domain>/            | grep -i content-security
        #   curl -sI https://<domain>/assets/x.js | grep -i content-security
        add_header X-Frame-Options            "DENY"                                     always;
        add_header X-Content-Type-Options     "nosniff"                                  always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains"      always;

        # CSP — vì sao từng chỉ thị có giá trị như vậy:
        #   script-src 'self'  : build production KHÔNG có script inline (đã kiểm
        #                        dist/index.html: chỉ <script type="module" src=...>).
        #                        KHÔNG cần 'unsafe-inline'/'unsafe-eval'.
        #   style-src  + 'unsafe-inline' : BẮT BUỘC — React render style attribute
        #                        (vd DataTable đặt width cột) và CSP coi đó là inline.
        #   fonts.googleapis/gstatic : còn cần tới khi tự host font Inter
        #                        (FRONTEND_REMEDIATION_PLAN P1-3). Bỏ 2 host này đi
        #                        được ngay sau khi font nằm trong /assets.
        #   connect-src 'self' : API (/api/v1) và MinIO (/lims-attachments) đều
        #                        same-origin qua chính nginx này.
        #   img-src data: blob: : avatar/preview dựng từ object URL.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # index.html KHÔNG được cache: tên bundle có hash, nhưng chính HTML là thứ trỏ tới
    # hash đó. Cache nó lại ⇒ sau khi deploy, trình duyệt vẫn xin bundle cũ đã bị xoá
    # và người dùng nhận trang trắng cho tới khi tự F5 cứng.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;

        add_header X-Frame-Options            "DENY"                                     always;
        add_header X-Content-Type-Options     "nosniff"                                  always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains"      always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Cache asset có hash (immutable)
    location /assets/ {
        # CỐ Ý không dùng `expires 1y` kèm add_header Cache-Control: hai chỉ thị đó
        # cùng phát ra header Cache-Control, response trả về HAI dòng
        # ("max-age=31536000" và "public, immutable") — hành vi không xác định tuỳ
        # trình duyệt. Gộp thành một giá trị duy nhất.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Lặp lại vì add_header ở location này CHẶN kế thừa từ location / (xem trên).
        # Không cần CSP ở đây: CSP chỉ có ý nghĩa với tài liệu, không với tệp .js/.css.
        add_header X-Frame-Options        "DENY"     always;
        add_header X-Content-Type-Options "nosniff"  always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
