# Hardened production profile for LIMS (see lims-backend/PRODUCTION_READINESS_REVIEW.html, Risk #1).
# Differences from docker-compose.yml:
#   - No default credentials: every secret is required via env, with no fallback value.
#   - Postgres/Redis/MinIO ports are NOT published to the host — reachable only on the
#     compose-internal network. Use SSH tunneling / `docker compose exec` for debugging.
#   - ENVIRONMENT=production (enables app.config's startup secret guard, disables /docs).
#
# Run:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Required in .env.prod (no defaults — compose fails fast if any is missing):
#   POSTGRES_PASSWORD, REDIS_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD,
#   JWT_SECRET (>=32 random chars), SEED_ADMIN_PASSWORD, CORS_ORIGINS,
#   MINIO_PUBLIC_ENDPOINT, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY
services:
  postgres:
    image: postgres:15-alpine
    container_name: lims-postgres
    mem_limit: 2g
    # max_connections phải >= workers x (pool_size + max_overflow) + dự phòng
    #   4 x (8 + 12) + 20 (migrate/psql/backup) = 100  ->  đặt 200 cho an toàn
    # log_min_duration_statement: bắt truy vấn chậm, phục vụ phân tích ở R6.3
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - log_min_duration_statement=500ms
    environment:
      POSTGRES_USER: lims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: lims
    volumes:
      - lims_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims -d lims"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lims-redis
    mem_limit: 512m
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}"]
    volumes:
      - lims_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: lims-minio
    mem_limit: 1g
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.prod}
    volumes:
      - lims_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration step — runs `alembic upgrade head` (advisory-lock guarded,
  # see lims-backend/entrypoint.sh) exactly once before the API starts, instead of
  # unconditionally inside every API container/replica's entrypoint
  # (PRODUCTION_READINESS_REVIEW: "Migrations run unconditionally inside every
  # container's entrypoint, no coordination lock").
  migrate:
    build: ./lims-backend
    container_name: lims-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://lims:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/lims
    command: ["true"]

  lims-api:
    build: ./lims-backend
    container_name: lims-api
    # Giới hạn tài nguyên — 1 export/request ngốn RAM không được OOM cả host
    # (PRODUCTION_READINESS_REVIEW §Reliability: "no resource limits declared anywhere").
    mem_limit: 1g
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://lims:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/lims
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}@redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?Set MINIO_PUBLIC_ENDPOINT in .env.prod}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.prod}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.prod}
      MINIO_BUCKET: lims-attachments
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod (>=32 random chars, unique per environment)}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.prod (comma-separated allowlist)}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@lims.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env.prod}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Set VAPID_PUBLIC_KEY in .env.prod}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?Set VAPID_PRIVATE_KEY in .env.prod}
      VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL:-admin@lims.local}
      # ── m30: tự đăng ký / quên mật khẩu / avatar ──
      # APP_PUBLIC_URL phải là origin thật người dùng mở, nếu không link trong mail sai.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in .env.prod}
      # ── R2.2: concurrency (xem phép tính ở khối command của postgres) ──
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-12}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.prod (bỏ trống thì mail không gửi được)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Viện CNSH & Môi trường — LIMS}
      SELF_REGISTRATION_ENABLED: ${SELF_REGISTRATION_ENABLED:-true}
      SELF_REGISTRATION_ALLOWED_DOMAINS: ${SELF_REGISTRATION_ALLOWED_DOMAINS:-}
      SKIP_MIGRATIONS: "true"
    # KHÔNG publish 8060 ra host: uvicorn chạy với --forwarded-allow-ips '*' nên tin
    # header X-Real-IP/X-Forwarded-For. Chỉ an toàn khi duy nhất nginx (trong mạng
    # compose) gọi tới được — mở cổng ra host là cho phép giả mạo IP để né rate limit.
    # Gỡ lỗi bằng: docker compose exec lims-api ...

  lims-web:
    build:
      context: ./lims-frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: lims-web
    depends_on:
      - lims-api
    ports:
      - "3060:80"

volumes:
  lims_pgdata:
  lims_redisdata:
  lims_miniodata:
