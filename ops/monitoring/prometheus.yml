# Prometheus cho LIMS (R9.3).
# lims-api đã expose /metrics sẵn (app/core/metrics.py) nhưng chưa ai scrape.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: lims-api
    metrics_path: /metrics
    static_configs:
      - targets: ["lims-api:8060"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
