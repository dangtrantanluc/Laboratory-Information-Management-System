name: Backend CI

# Minimum viable pipeline (PRODUCTION_READINESS_REVIEW.html §Reliability/§ROI):
# lint + pytest + migration dry-run + Docker build, on every PR/push to main.
# Nothing here blocks merges on pre-existing debt beyond what's already clean
# today — see lims-backend/ruff.toml for why the lint rule set is intentionally
# narrow for now.

on:
  push:
    branches: [main]
    paths:
      - "lims-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "lims-backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: lims-backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: lims-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: lims-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Unit tests (mock DB) — integration tests auto-skip khi thiếu TEST_DATABASE_URL.
      - run: python -m pytest app/tests -v

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lims
          POSTGRES_PASSWORD: lims
          POSTGRES_DB: lims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lims -d lims_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: lims-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # TEST_DATABASE_URL bật integration test (Postgres THẬT — H3/M6/atomicity).
      - name: pytest integration
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://lims:lims@localhost:5432/lims_test
          DATABASE_URL: postgresql+psycopg2://lims:lims@localhost:5432/lims_test
        run: python -m pytest app/tests/integration -v

  migration-dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lims
          POSTGRES_PASSWORD: lims
          POSTGRES_DB: lims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lims -d lims"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: lims-backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: alembic upgrade head (throwaway Postgres)
        env:
          DATABASE_URL: postgresql+psycopg2://lims:lims@localhost:5432/lims
        run: python -m alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: lims-backend
          push: false
          tags: lims-backend:ci
